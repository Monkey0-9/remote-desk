[workspace]
members = [
    "crates/remote-desk-proto",
    "crates/remote-desk-core",
    "crates/remote-desk-linux",
    "crates/remote-desk-windows",
    "crates/remote-desk-net",
    "crates/remote-desk-signal",
    "crates/remote-desk-bench",
    "crates/remote-desk-host",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Remote-Desk Contributors"]
repository = "https://github.com/remote-desk/remote-desk"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "1.0"
async-trait = "0.1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
byteorder = "1.5"
