name: Remote-Desk Production CI/CD Matrix

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # 1. Rust Formatting & Lints
  rust-lint:
    name: 1. Rust Formatting & Clippy Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Verify Formatting
        run: cargo fmt --check
      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

  # 2. Rust Unit & Integration Tests
  rust-workspace-tests:
    name: 2. Rust Workspace Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Execute Workspace Tests
        run: cargo test --workspace --all-targets

  # 3. Linux Native Backend Build & Tests
  linux-native-backend:
    name: 3. Linux Native Backend Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Linux Development Headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxrandr-dev libdbus-1-dev
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build Linux Crate
        run: cargo build -p remote-desk-linux
      - name: Run Linux Crate Tests
        run: cargo test -p remote-desk-linux

  # 4. Linux Wayland Portal Integration Tests
  linux-wayland-portal:
    name: 4. Linux Wayland Portal Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install DBus & Tools
        run: sudo apt-get update && sudo apt-get install -y dbus dbus-x11
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Portal Tests in Isolated DBus Session
        run: dbus-run-session -- cargo test -p remote-desk-linux --test capture_real_test

  # 5. Linux X11 Integration Tests
  linux-x11-integration:
    name: 5. Linux X11 XTest & MIT-SHM Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install X11 and Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb libx11-dev libxtst-dev libxrandr-dev
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run X11 Tests under Virtual Framebuffer
        run: xvfb-run -s "-screen 0 1920x1080x24" cargo test -p remote-desk-linux --test input_injector_test

  # 6. Windows Native Backend Build & Tests
  windows-native-backend:
    name: 6. Windows Native Host Engine Build & Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Test Windows Crate on Windows Runner
        run: cargo test -p remote-desk-windows

  # 7. Android Gradle Build & Unit Tests
  android-build-test:
    name: 7. Android Gradle Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Run Android Unit Tests
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

  # 8. Rust/Kotlin Protocol Compatibility Tests
  protocol-golden-vectors:
    name: 8. Wire Protocol Golden Vector Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Rust Protocol Golden Tests
        run: cargo test -p remote-desk-proto --test golden_vectors_test

  # 9. Protocol Fuzz Testing
  protocol-fuzzing:
    name: 9. Protocol Codec & State Machine Fuzzing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Protocol Fuzzing and Boundary Tests
        run: cargo test -p remote-desk-proto --test codec_tests test_fuzz

  # 10. Dependency Vulnerability Scanning
  security-vulnerability-scan:
    name: 10. Dependency Vulnerability Scanning (Cargo Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Cargo Audit
        run: which cargo-audit || cargo install cargo-audit
      - name: Scan Rust Dependencies for CVEs
        run: cargo audit || true

  # 11. Secret Scanning & Credential Hygiene
  secret-scanning:
    name: 11. Secret Scanning & Credential Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # 12. Docker & Signaling Service Verification
  docker-signaling:
    name: 12. Signaling Service Docker Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Signaling Server Tests
        run: cargo test -p remote-desk-signal
      - name: Build Signaling Server Docker Image
        run: docker build -t remote-desk-signal:test -f deploy/docker/Dockerfile.signal .

  # 13. COTURN TURN Configuration Validation
  turn-coturn-verify:
    name: 13. COTURN Configuration Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Validate coturn.conf syntax
        run: |
          test -f deploy/docker/coturn.conf
          grep -q "listening-port=3478" deploy/docker/coturn.conf
          grep -q "tls-listening-port=5349" deploy/docker/coturn.conf

  # 14. Packaging Tests
  packaging-tests:
    name: 14. Linux & Windows Packaging Script Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Check Package Definitions
        run: |
          test -f packaging/debian/control
          test -f packaging/rpm/remote-desk.spec
          test -f packaging/windows/remote-desk.wxs
          test -x packaging/appimage/build-appimage.sh

  # 15. End-to-End System Integration Harness
  e2e-system-simulation:
    name: 15. End-to-End LAN & Host Lifecycle Harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run Full End-to-End Integration Harness
        run: cargo run -p remote-desk-host --example full_system_test
      - name: Run Empirical Performance Benchmarks
        run: cargo run -p remote-desk-bench

  # 16. OpenSpec Validation & Artifact Provenance
  openspec-and-provenance:
    name: 16. OpenSpec Standards & Release Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec
      - name: Validate OpenSpec Specifications
        run: openspec validate --all
      - name: Generate Checksums
        run: |
          test -f Cargo.lock || cargo generate-lockfile
          sha256sum Cargo.lock README.md > SHA256SUMS.txt
          cat SHA256SUMS.txt

  # 17. Host Management Dashboard Build & Verification
  dashboard-build:
    name: 17. Host Management Dashboard Build & Bundle Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dashboard Dependencies
        run: cd apps/dashboard && npm ci
      - name: Build Production Cloudscape Dashboard
        run: cd apps/dashboard && npm run build
      - name: Verify Dashboard Distribution Assets
        run: |
          test -f apps/dashboard/dist/index.html
          test -d apps/dashboard/dist/assets
          test -f apps/dashboard/dist/assets/*.js
          test -f apps/dashboard/dist/assets/*.css
