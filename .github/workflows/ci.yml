name: Remote-Desk CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  rust-verify:
    name: Rust Workspace Tests & Lints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify Code Formatting
        run: cargo fmt --check

      - name: Execute Clippy Pedantic Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Full Workspace Tests
        run: cargo test --workspace --all-targets

      - name: Run Loopback Streaming Prototype Simulation
        run: cargo run -p remote-desk-linux --example loopback_prototype

      - name: Run Full End-to-End System Integration Test
        run: cargo run -p remote-desk-host --example full_system_test

      - name: Run Empirical Performance Microbenchmarks
        run: cargo run -p remote-desk-bench

  openspec-verify:
    name: OpenSpec Standards Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec

      - name: Validate OpenSpec Specifications
        run: openspec validate --all
